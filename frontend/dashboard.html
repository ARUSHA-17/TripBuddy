<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TripBuddy - Dashboard</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="dashboard-container">
        <h1>Welcome to TripBuddy Dashboard, <span id="userName">Traveler</span>!</h1>
        <button id="logoutBtn">Logout</button>

        <hr>

        <h2>Create a New Trip</h2>
        <form id="tripForm">
            <input type="text" id="destination" placeholder="Destination (e.g., Sri Lanka)" required>
            <input type="date" id="startDate" required>
            <input type="date" id="endDate" required>
            <textarea id="notes" placeholder="Trip notes or activities..."></textarea>
            <button type="submit">Add Trip</button>
        </form>

        <h2>Your Saved Trips</h2>
        <div id="tripList"></div>
    </div>

    <script src="./dashboard.js"></script>
</body>
</html>
